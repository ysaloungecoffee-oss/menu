<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>YSA LOUNGE COFFEE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{--bg:#08080a;--c:#141416;--t:#f4f4f5;--text-muted:#9ca3af;--primary:#3b82f6;--primary-hover:#2563eb;--danger:#ef4444;--border:#2a2a2f;--s0:#18181b;--s1:#1f1f23;--s2:#2c2c32;--shadow-sm:0 1px 2px 0 rgba(0,0,0,.5);--shadow:0 4px 8px -1px rgba(0,0,0,.6);--radius:14px;--font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color-scheme:dark}
  [data-theme="light"]{--bg:#f1f5f9;--c:#ffffff;--t:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--s0:#f8fafc;--s1:#f1f5f9;--s2:#e2e8f0;--shadow-sm:0 1px 2px rgba(15,23,42,.08);--shadow:0 4px 8px -1px rgba(15,23,42,.12);color-scheme:light}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--t);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font-family:inherit;font-size:15px;outline:none;transition:all .2s}

  header{position:sticky;top:0;z-index:20;background:#08080a;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);padding-top:env(safe-area-inset-top,0)}
  .top{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;max-width:760px;margin:auto;position:relative;min-height:80px}
  .brand-logo{height:85px;max-width:70vw;object-fit:contain}
  .ib{position:absolute;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--s1);color:var(--t);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;padding:0;flex:none}
  .ib:hover{background:var(--s2)}
  .hb{left:16px;right:auto;font-size:20px}
  .hidden{display:none!important}

  main{max-width:760px;margin:auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}

  /* KATEGORİ KARELERİ */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
  .tile{position:relative;aspect-ratio:1/1;border:0;padding:0;border-radius:var(--radius);overflow:hidden;cursor:pointer;color:#fff;text-align:left;box-shadow:var(--shadow);background:var(--s1)}
  .tile:active{transform:scale(.97)}
  .tile:hover{filter:brightness(1.08)}
  .tile .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tile .emo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(44px,14vw,72px);opacity:.9;padding-bottom:18%}
  .tile .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.05) 100%)}
  .tile .lbl{position:absolute;left:0;right:0;bottom:0;padding:12px;font-weight:700;font-size:clamp(13px,3.6vw,16px);line-height:1.25;text-transform:uppercase;letter-spacing:.04em;word-break:break-word;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .tile .cnt{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}

  /* ÜRÜN LİSTESİ */
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .bar h2{margin:0;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;word-break:break-word}

  .card{background:var(--c);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
  .item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);transition:background .2s}
  .item:last-child{border-bottom:none}
  .item:hover{background:var(--s0)}
  .item.out{opacity:.5}
  .pic{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--s1);flex:none}
  .pic.ph{display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:22px}
  .info{flex:1;min-width:0}
  .name{font-weight:600;font-size:15px;line-height:1.3;word-break:break-word}
  .out-tag{display:inline-block;margin-top:4px;font-size:12px;color:var(--danger);font-weight:600}
  .price{font-weight:700;font-size:15px;color:var(--primary);white-space:nowrap;background:rgba(59,130,246,.12);padding:5px 12px;border-radius:20px}

  .state{text-align:center;padding:60px 20px;color:var(--text-muted)}
  .state h3{margin:16px 0 6px;color:var(--t);font-weight:600}
  .state p{margin:0 0 20px;font-size:14px}
  .state button{background:var(--primary);color:#fff;border:0;border-radius:8px;padding:10px 22px;min-height:44px;font-weight:500;cursor:pointer}
  .state button:hover{background:var(--primary-hover)}
  .ico{width:64px;height:64px;border-radius:50%;background:rgba(239,68,68,.15);color:var(--danger);display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
  .sk{border-radius:var(--radius);aspect-ratio:1/1;background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 37%,var(--s1) 63%);background-size:400% 100%;animation:sh 1.4s ease infinite}
  @keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
  footer{text-align:center;color:var(--text-muted);font-size:12px;padding:0 16px 30px}
</style>
</head>
<body>
<script>
  /* ====== AYARLAR ====== */
  const csvUrl = 'https://dl.dropboxusercontent.com/scl/fi/ab7f5h0yrt1zc4tikm563/qr_menu.csv?rlkey=04f8ytyv6ftu0d5bnujyxmrva&st=tqw5x9ff&dl=1';
  const cafeName = 'YSA LOUNGE COFFEE';
</script>

<header>
  <div class="top">
    <button class="ib hb hidden" id="hb" aria-label="Geri" onclick="goBack()">←</button>
    <img class="brand-logo" src="https://dl.dropboxusercontent.com/scl/fi/7z5d1grg4mass50aa0ubg/ysa.png?rlkey=p4fn8rakng4xldpsz039ypfs3&st=bwyoshtn&dl=1" alt="YSA Lounge Coffee">
    <button class="ib" id="thb" aria-label="Tema" onclick="toggleTheme()">☀️</button>
  </div>
</header>

<main id="app"></main>
<footer>Afiyet olsun ☕</footer>

<script>
  const $ = s => document.querySelector(s);
  const E = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => (+n).toFixed(2) + ' ₺';

  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('theme', t); } catch (e) {}
    $('#thb').textContent = t === 'light' ? '🌙' : '☀️';
    const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'light' ? '#ffffff' : '#08080a';
  }
  function toggleTheme() { applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); }
  let saved = 'dark'; try { saved = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  applyTheme(saved);
  document.title = cafeName;

  let DATA = [];

  function loadingUI() {
    $('#app').innerHTML = `<div class="grid">${Array.from({length:6}, () => '<div class="sk"></div>').join('')}</div>`;
  }
  function errorUI(msg) {
    $('#app').innerHTML = `<div class="state"><div class="ico">!</div><h3>Menü yüklenemedi</h3><p>${E(msg || 'Lütfen bağlantınızı kontrol edip tekrar deneyin.')}</p><button onclick="init()">Tekrar Dene</button></div>`;
  }

  function parsePrice(v) {
    const n = parseFloat(String(v ?? '').replace(/[^\d.,-]/g, '').replace(/\.(?=\d{3}\b)/g, '').replace(',', '.'));
    return isNaN(n) ? null : n;
  }
  function safeImg(src) {
    const s = String(src || '').trim();
    return /^data:image\/(png|jpeg|gif|webp|x-icon);base64,[A-Za-z0-9+/=]+$/.test(s) ? s : '';
  }

  /* Kategori adına göre emoji ve renk (görsel yoksa) */
  function catEmoji(name) {
    const n = name.toLocaleLowerCase('tr');
    const map = [
      [/kahve|coffee|espresso|latte|americano|mocha|cappuc/, '☕'],
      [/çay|cay|tea|bitki/, '🍵'],
      [/soğuk|soguk|ice|frappe|buz|limonata/, '🧊'],
      [/milkshake|shake|smoothie/, '🥤'],
      [/tatlı|tatli|pasta|cake|waffle|cheesecake|dondurma/, '🍰'],
      [/tost|sandviç|sandvic|burger|atıştırma|atistirma/, '🥪'],
      [/kahvaltı|kahvalti/, '🍳'],
      [/salata/, '🥗'],
      [/pizza/, '🍕'],
      [/makarna/, '🍝'],
      [/nargile/, '💨'],
      [/içecek|icecek|meşrubat|mesrubat|su|gazoz|kola/, '🥤']
    ];
    for (const [re, e] of map) if (re.test(n)) return e;
    return '🍽';
  }
  function catGradient(name) {
    let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return `linear-gradient(135deg,hsl(${h},55%,32%),hsl(${(h + 40) % 360},60%,18%))`;
  }

  async function init() {
    loadingUI();
    try {
      const res = await fetch(csvUrl + `&t=${new Date().getTime()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('Sunucu yanıt vermedi (' + res.status + ')');
      const text = await res.text();
      const out = Papa.parse(text, {
        header: true, skipEmptyLines: true, delimiter: '',
        transformHeader: h => h.trim().replace(/^\uFEFF/, '')
      });
      const rows = (out.data || []).map(r => ({
        cat: String(r['Kategori'] || '').trim() || 'Diğer',
        name: String(r['Ürün'] || '').trim(),
        price: parsePrice(r['Fiyat']),
        out: /tükendi/i.test(String(r['Durum'] || '')),
        img: safeImg(r['Görsel'])
      })).filter(r => r.name && r.price !== null);
      if (!rows.length) throw new Error('Menüde gösterilecek ürün bulunamadı.');
      DATA = rows;
      show();
    } catch (e) {
      errorUI(e && e.message);
    }
  }

  function groups() {
    const map = new Map();
    DATA.forEach(r => {
      if (!map.has(r.cat)) map.set(r.cat, []);
      map.get(r.cat).push(r);
    });
    return map;
  }

  /* Ana ekran: kategori kareleri */
  function renderHome() {
    const g = groups(), cats = [...g.keys()];
    $('#app').innerHTML = `<div class="grid">${cats.map((c, i) => {
      const items = g.get(c);
      const withImg = items.find(p => p.img);
      const bg = withImg
        ? `<img class="bg" loading="lazy" src="${withImg.img}" alt="">`
        : `<div class="bg" style="background:${catGradient(c)}"></div><div class="emo">${catEmoji(c)}</div>`;
      return `<button class="tile" data-i="${i}">${bg}<div class="shade"></div><span class="cnt">${items.length}</span><div class="lbl">${E(c)}</div></button>`;
    }).join('')}</div>`;
    $('#app').querySelectorAll('.tile').forEach(b => b.onclick = () => { location.hash = 'c' + b.dataset.i; });
  }

  /* Kategori ekranı: ürün listesi */
  function renderCat(i) {
    const g = groups(), cats = [...g.keys()], c = cats[i];
    if (c === undefined) { location.hash = ''; return; }
    $('#app').innerHTML = `
      <div class="bar"><h2>${E(c)}</h2></div>
      <div class="card">${g.get(c).map(p => `
        <div class="item${p.out ? ' out' : ''}">
          ${p.img ? `<img class="pic" loading="lazy" src="${p.img}" alt="">` : `<div class="pic ph">🍽</div>`}
          <div class="info">
            <div class="name">${E(p.name)}</div>${p.out ? '<div class="out-tag">Tükendi</div>' : ''}
          </div>
          <div class="price">${fmt(p.price)}</div>
        </div>`).join('')}
      </div>`;
  }

  function goBack() { if (history.length > 1) history.back(); else location.hash = ''; }

  function show() {
    if (!DATA.length) return;
    const m = location.hash.match(/^#c(\d+)$/);
    if (m) renderCat(+m[1]); else renderHome();
    $('#hb').classList.toggle('hidden', !m);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  window.addEventListener('hashchange', show);

  init();
</script>
</body>
</html>
