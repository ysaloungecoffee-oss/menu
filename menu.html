<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>YSA LOUNGE COFFEE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{--bg:#08080a;--c:#141416;--t:#f4f4f5;--text-muted:#9ca3af;--primary:#3b82f6;--primary-hover:#2563eb;--danger:#ef4444;--success:#10b981;--warning:#f59e0b;--border:#2a2a2f;--header-bg:#101012;--s0:#18181b;--s1:#1f1f23;--s2:#2c2c32;--shadow-sm:0 1px 2px 0 rgba(0,0,0,.5);--shadow:0 4px 8px -1px rgba(0,0,0,.6);--radius:12px;--font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color-scheme:dark}
  [data-theme="light"]{--bg:#f1f5f9;--c:#ffffff;--t:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--header-bg:#ffffff;--s0:#f8fafc;--s1:#f1f5f9;--s2:#e2e8f0;--shadow-sm:0 1px 2px rgba(15,23,42,.08);--shadow:0 4px 8px -1px rgba(15,23,42,.12);color-scheme:light}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--t);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font-family:inherit;font-size:15px;outline:none;transition:all .2s}
  
  header{position:sticky;top:0;z-index:20;background:#08080a;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);padding-top:env(safe-area-inset-top,0)}
  .top{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;max-width:760px;margin:auto;position:relative;min-height:80px;}
  
  /* LOGO BOYUTU */
  .brand-logo { height: 85px; max-width: 70vw; object-fit: contain; }
  
  .ib{position:absolute; right:16px; width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--s1);color:var(--t);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;padding:0;flex:none}
  .ib:hover{background:var(--s2)}
  
  /* KATEGORİLER (PILLS) - Scroll kaldırıldı, alt alta wrap özelliği eklendi */
  .pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 16px 12px;max-width:760px;margin:auto}
  .pill{flex:0 0 auto;white-space:nowrap;background:var(--s1);color:var(--t);border:1px solid var(--s2);border-radius:20px;padding:6px 16px;min-height:36px;font-weight:500;font-size:14px;cursor:pointer}
  .pill:hover{background:var(--s2)}
  .pill.on{background:var(--primary);border-color:var(--primary);color:#fff}
  
  main{max-width:760px;margin:auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
  .sec{scroll-margin-top:150px;margin-bottom:28px}
  .sec h2{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px 4px}
  .sec h2 .badge{background:var(--s1);color:var(--text-muted);border-radius:20px;padding:2px 10px;font-size:12px;letter-spacing:0;text-transform:none}
  .card{background:var(--c);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
  .item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);transition:background .2s}
  .item:last-child{border-bottom:none}
  .item:hover{background:var(--s0)}
  .item.out{opacity:.5}
  .pic{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--s1);flex:none}
  .pic.ph{display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:22px}
  .info{flex:1;min-width:0}
  .name{font-weight:600;font-size:15px;line-height:1.3;word-break:break-word}
  .out-tag{display:inline-block;margin-top:4px;font-size:12px;color:var(--danger);font-weight:600}
  .price{font-weight:700;font-size:15px;color:var(--primary);white-space:nowrap;background:rgba(59,130,246,.12);padding:5px 12px;border-radius:20px}
  .state{text-align:center;padding:60px 20px;color:var(--text-muted)}
  .state h3{margin:16px 0 6px;color:var(--t);font-weight:600}
  .state p{margin:0 0 20px;font-size:14px}
  .state button{background:var(--primary);color:#fff;border:0;border-radius:8px;padding:10px 22px;min-height:44px;font-weight:500;cursor:pointer}
  .state button:hover{background:var(--primary-hover)}
  .ico{width:64px;height:64px;border-radius:50%;background:rgba(239,68,68,.15);color:var(--danger);display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
  .sk{height:18px;border-radius:6px;background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 37%,var(--s1) 63%);background-size:400% 100%;animation:sh 1.4s ease infinite}
  .sk.t{width:120px;margin:0 0 12px 4px;height:14px}
  .sk-row{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid var(--border)}
  .sk-row:last-child{border-bottom:none}
  .sk-row .sk.img{width:64px;height:64px;border-radius:10px;flex:none}
  .sk-row .sk.l{flex:1}
  .sk-row .sk.r{width:64px}
  @keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
  footer{text-align:center;color:var(--text-muted);font-size:12px;padding:0 16px 30px}
  .hide{display:none!important}
</style>
</head>
<body>
<script>
  /* ====== AYARLAR ====== */
  const csvUrl = 'https://dl.dropboxusercontent.com/scl/fi/ab7f5h0yrt1zc4tikm563/qr_menu.csv?rlkey=04f8ytyv6ftu0d5bnujyxmrva&st=tqw5x9ff&dl=1';
  const cafeName = 'YSA LOUNGE COFFEE';
</script>

<header>
  <div class="top">
    <!-- Güncel Logo Linki -->
    <img class="brand-logo" src="https://dl.dropboxusercontent.com/scl/fi/u2vmug06489y3u5poln50/logo.png?rlkey=r115p7daccnv1jknuh22gd6nc&st=9vyaalmj&dl=1" alt="YSA Lounge Coffee">
    <button class="ib" id="thb" aria-label="Tema" onclick="toggleTheme()">☀️</button>
  </div>
  <nav class="pills hide" id="pl"></nav>
</header>

<main id="app"></main>
<footer>Afiyet olsun ☕</footer>

<script>
  const $ = s => document.querySelector(s);
  const E = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => (+n).toFixed(2) + ' ₺';

  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('theme', t); } catch (e) {}
    $('#thb').textContent = t === 'light' ? '🌙' : '☀️';
    const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'light' ? '#ffffff' : '#08080a';
  }
  function toggleTheme() { applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); }
  let saved = 'dark'; try { saved = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  applyTheme(saved);
  
  document.title = cafeName;

  let DATA = [], active = '';

  function loadingUI() {
    const rows = n => Array.from({length:n}, () => '<div class="sk-row"><div class="sk img"></div><div class="sk l"></div><div class="sk r"></div></div>').join('');
    $('#app').innerHTML = [3,2].map(n => `<div class="sec"><div class="sk t"></div><div class="card">${rows(n)}</div></div>`).join('');
    $('#pl').classList.add('hide');
  }
  function errorUI(msg) {
    $('#pl').classList.add('hide');
    $('#app').innerHTML = `<div class="state"><div class="ico">!</div><h3>Menü yüklenemedi</h3><p>${E(msg || 'Lütfen bağlantınızı kontrol edip tekrar deneyin.')}</p><button onclick="init()">Tekrar Dene</button></div>`;
  }

  function parsePrice(v) {
    const n = parseFloat(String(v ?? '').replace(/[^\d.,-]/g, '').replace(/\.(?=\d{3}\b)/g, '').replace(',', '.'));
    return isNaN(n) ? null : n;
  }
  function safeImg(src) {
    const s = String(src || '').trim();
    return /^data:image\/(png|jpeg|gif|webp|x-icon);base64,[A-Za-z0-9+/=]+$/.test(s) ? s : '';
  }

  async function init() {
    loadingUI();
    try {
      const res = await fetch(csvUrl + `&t=${new Date().getTime()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('Sunucu yanıt vermedi (' + res.status + ')');
      const text = await res.text();
      const out = Papa.parse(text, {
        header: true, skipEmptyLines: true, delimiter: '',
        transformHeader: h => h.trim().replace(/^\uFEFF/, '')
      });
      const rows = (out.data || []).map(r => ({
        cat: String(r['Kategori'] || '').trim() || 'Diğer',
        name: String(r['Ürün'] || '').trim(),
        price: parsePrice(r['Fiyat']),
        out: /tükendi/i.test(String(r['Durum'] || '')),
        img: safeImg(r['Görsel'])
      })).filter(r => r.name && r.price !== null);
      if (!rows.length) throw new Error('Menüde gösterilecek ürün bulunamadı.');
      DATA = rows; active = '';
      $('#pl').classList.remove('hide');
      render();
    } catch (e) {
      errorUI(e && e.message);
    }
  }

  function groups() {
    const map = new Map();
    DATA.forEach(r => {
      if (!map.has(r.cat)) map.set(r.cat, []);
      map.get(r.cat).push(r);
    });
    return map;
  }

  function render() {
    const g = groups(), cats = [...g.keys()];
    if (!active || !cats.includes(active)) active = cats[0] || '';
    $('#pl').innerHTML = cats.map((c, i) => `<button class="pill${c === active ? ' on' : ''}" data-i="${i}">${E(c)}</button>`).join('');
    $('#pl').querySelectorAll('.pill').forEach(b => b.onclick = () => {
      const el = document.getElementById('c' + b.dataset.i);
      active = cats[b.dataset.i]; if (el) el.scrollIntoView({ behavior:'smooth' }); render();
    });
    $('#app').innerHTML = cats.map((c, i) => `
      <section class="sec" id="c${i}">
        <h2>${E(c)} <span class="badge">${g.get(c).length}</span></h2>
        <div class="card">${g.get(c).map(p => `
          <div class="item${p.out ? ' out' : ''}">
            ${p.img ? `<img class="pic" loading="lazy" src="${p.img}" alt="">` : `<div class="pic ph">🍽</div>`}
            <div class="info">
              <div class="name">${E(p.name)}</div>${p.out ? '<div class="out-tag">Tükendi</div>' : ''}
            </div>
            <div class="price">${fmt(p.price)}</div>
          </div>`).join('')}
        </div>
      </section>`).join('') ||
      `<div class="state"><div class="ico" style="background:var(--s1);color:var(--text-muted)">🍽</div><h3>Menü boş</h3><p>Henüz gösterilecek ürün yok.</p></div>`;
  }

  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const secs = [...document.querySelectorAll('.sec')]; if (!secs.length) return;
      let cur = secs[0];
      secs.forEach(s => { if (s.getBoundingClientRect().top <= 170) cur = s; });
      const name = cur.querySelector('h2').firstChild.textContent.trim();
      if (name !== active) {
        active = name;
        document.querySelectorAll('.pill').forEach(p => {
          const on = p.textContent === name; p.classList.toggle('on', on);
          if (on) p.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
        });
      }
    });
  }, { passive:true });

  init();
</script>
</body>
</html>
